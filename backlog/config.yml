project_name: "tor2eprint"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Needs smoke", "Hand check", "Done", "Blocked"]
labels: ["code", "css", "template", "i18n", "tooling", "release", "docs", "bug", "idea", "system-upgrade"]
date_format: "yyyy-mm-dd"
max_column_width: 20
default_editor: 'nvim'
auto_open_browser: true
default_port: 6420
browser_hostname: "127.0.0.1"
remote_operations: false
auto_commit: false
filesystem_only: false
bypass_git_hooks: false
check_active_branches: false
active_branch_days: 30
task_prefix: "task"
definition_of_done:
  - "Check in tests/smoke.mjs; `npm run smoke` passes"
  - "Hand check in a v14 + tor2e world if the change has UI: button shows, window opens and prints once, clean preview, no raw `tor2e.*` keys, no console errors"
  - "README.md and CLAUDE.md (Status, schema notes) updated in the same commit"
  - "module.json `compatibility` / `relationships` updated if the tested Foundry or tor2e build changed; release tag noted if it ships"
